source_id: pimland_product_groups
enabled: true
type: mcp
target_table: pim_product_groups
description: "Pimland PLM — Ürün grupları ve ana ürün grupları"

connection:
  url: "https://agentup-mcp-test.pimland.com/30001"
  timeout_seconds: 30

auth:
  type: oauth2_password_grant
  token_url_env: PIMLAND_TOKEN_URL
  client_id_env: PIMLAND_CLIENT_ID
  client_secret_env: PIMLAND_CLIENT_SECRET
  scope_env: PIMLAND_SCOPE
  username_env: PIMLAND_USERNAME
  password_env: PIMLAND_PASSWORD

tool:
  name: post_api_MasterData_product_groups_get_product_groups
  args:
    filter: null
  response_data_path: "content.data.result"

field_map:
  referenceCode: reference_code
  isActive: is_active

schedule:
  cron: "0 2 * * *"
